openapi: "3.0.3"
info:
  title: Gemini Response API
  version: "1.0.0"
servers:
  - url: http://localhost:5000/
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
paths:
  /:
    get:
      summary: Fetch the result from Gemini
      parameters:
        - name: q
          in: query
          description: Query parameter
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Answer to the query by user
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    type: string
        "400":
          description: Bad request or content policy violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: API offline or model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"